name: Build Camellia kernel 6.6 OrangeFox

on:
  workflow_dispatch:
    inputs:
      layout:
        description: Recovery image layout
        type: choice
        default: vendor-boot-v3
        options:
          - vendor-boot-v3
          - boot-v2
  push:
    branches: [kernel-6.6]
    paths:
      - '.github/workflows/build.yaml'

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.ref }}-${{ inputs.layout || 'vendor-boot-v3' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      GIT_AUTHOR_NAME: Recovery CI
      GIT_AUTHOR_EMAIL: recovery-ci@users.noreply.github.com
      GIT_COMMITTER_NAME: Recovery CI
      GIT_COMMITTER_EMAIL: recovery-ci@users.noreply.github.com
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: Recovery CI
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: recovery-ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          path: device-tree
          persist-credentials: false
      - name: Validate the selected tree
        working-directory: device-tree
        env:
          LAYOUT: ${{ inputs.layout || 'vendor-boot-v3' }}
        run: |
          python3 tools/select-layout.py "$LAYOUT"
          python3 tools/validate-tree.py
      - name: Prepare the build machine
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig rsync python2 python3 ccache
          mkdir -p "$HOME/bin" "$GITHUB_WORKSPACE/OrangeFox"
          curl --fail --location --retry 3 https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod 755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Fetch OrangeFox sync scripts
        run: |
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git sync
          git -C sync fetch --depth 1 origin 73d4d94e0d1b11b9035dea72ee223d25b1fefa7c
          git -C sync checkout --detach 73d4d94e0d1b11b9035dea72ee223d25b1fefa7c
      - name: Sync OrangeFox fox_12.1
        working-directory: sync
        run: bash orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/OrangeFox"
      - name: Install this device tree
        run: |
          mkdir -p OrangeFox/device/xiaomi/camellia
          rsync -a --exclude=.git --exclude=out device-tree/ OrangeFox/device/xiaomi/camellia/
      - name: Build recovery images
        run: |
          set -o pipefail
          bash OrangeFox/device/xiaomi/camellia/tools/build-recovery.sh "$GITHUB_WORKSPACE/OrangeFox" \
            2>&1 | tee recovery-build.log
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: camellia-ofox-k66-${{ inputs.layout || 'vendor-boot-v3' }}
          path: |
            OrangeFox/out/target/product/camellia/boot.img
            OrangeFox/out/target/product/camellia/vendor_boot.img
            OrangeFox/out/target/product/camellia/OrangeFox*.img
            OrangeFox/out/target/product/camellia/OrangeFox*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-ofox-build-logs
          path: |
            recovery-build.log
            OrangeFox/out/error.log
            OrangeFox/out/soong/build.ninja
          if-no-files-found: ignore
          retention-days: 7
